services:
  service:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      HTTP_ADDRESS: "${HTTP_ADDRESS:-0.0.0.0:8080}"
      HTTP_TRUSTED_PROXIES: "${HTTP_TRUSTED_PROXIES:-}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:-2s}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-5s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:-10s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-30s}"
      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT:-10s}"
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:postgres@db:5432/postgres}"
      MAX_CONNS: "${MAX_CONNS:-}"
      MIN_CONNS: "${MIN_CONNS:-}"
      MAX_CONN_LIFETIME: "${MAX_CONN_LIFETIME:-}"
      MAX_CONN_IDLE_TIME: "${MAX_CONN_IDLE_TIME:-}"

    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db_data:

openapi: 3.0.3
info:
  title: Template Go Monolith API
  version: v1
  description: HTTP API for health checks and users.
servers:
  - url: /
paths:
  /_health:
    get:
      tags: [Health]
      summary: Check service readiness
      operationId: checkHealth
      responses:
        '200':
          description: Service and PostgreSQL are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: Service or PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal health check error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/create-and-delete:
    post:
      tags: [Users]
      summary: Create and delete a user in one transaction
      description: Runs an INSERT and DELETE in one transaction. On success no user row remains. Returns the user snapshot and the completed operation status.
      operationId: createAndDeleteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAndDeleteUserRequest'
      responses:
        '200':
          description: Transaction committed. The user was created and deleted; no user row remains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAndDeleteUserResponse'
        '400':
          description: Invalid JSON or user name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateAndDeleteUserRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 32
          example: Alice
    CreateAndDeleteUserResponse:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [created_and_deleted]
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [success]
    ErrorResponse:
      type: object
      required: [status, error]
      properties:
        status:
          type: string
          enum: [error]
        error:
          type: string
